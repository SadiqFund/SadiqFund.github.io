# خودکارساز داشبورد صندوق
# هر ۳۰ دقیقه کانال تلگرام را چک می‌کند؛ اگر اکسل تازه آمده بود، داشبورد را می‌سازد و منتشر می‌کند.
# اجرای دستی: تب Actions ← Update dashboard ← Run workflow
name: Update dashboard

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "ساخت دوباره با آخرین فایل‌ها، حتی اگر فایل تازه‌ای نیامده باشد"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install
        working-directory: automation
        run: npm ci --no-audit --no-fund

      - name: Build from Telegram
        working-directory: automation
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_CHAT_ID: ${{ secrets.NOTIFY_CHAT_ID }}
          PORSLINE_API_KEY: ${{ secrets.PORSLINE_API_KEY }}
          PORSLINE_SURVEY_ID: ${{ secrets.PORSLINE_SURVEY_ID }}
          PORSLINE_QUESTION_ID: ${{ secrets.PORSLINE_QUESTION_ID }}
          NAME_FIXES: ${{ secrets.NAME_FIXES }}
          SITE_URL: https://${{ github.repository_owner }}.github.io
          FORCE_REBUILD: ${{ inputs.force }}
        run: node build.js

      - name: Publish
        run: |
          git config user.name "dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html automation/state.json
          if git diff --cached --quiet; then
            echo "[dashboard] nothing to commit."
          else
            git commit -m "به‌روزرسانی خودکار داشبورد"
            git push
          fi
